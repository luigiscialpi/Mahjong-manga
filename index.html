<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Majoa Mahjong</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --felt-a:#1f6b57; --felt-b:#134536; --ink:#f6efd9; --ink-soft:#d4e6dc;
  --panel:rgba(0,0,0,.30); --btn:#f3e7c4; --btn-ink:#3b2a14; --btn-shadow:#b49a5e;
  --accent:#e8b43a; --edge:#2a8a62; --edge2:#17503b;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--felt-b);
  background-image:radial-gradient(ellipse at 50% 40%,var(--felt-a),var(--felt-b) 75%);
  color:var(--ink);transition:background .6s;
  font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;gap:8px}
.lv{
  background:var(--panel);color:var(--ink);border:2px solid var(--accent);border-radius:14px;
  min-height:46px;padding:2px 9px;box-shadow:none;align-items:flex-start;flex-direction:column;gap:0;font-size:17px
}
.lv small{font-size:12px;font-weight:600;color:var(--accent)}
.stats{display:flex;gap:6px;align-items:center}
.stat{background:var(--panel);border-radius:12px;padding:4px 7px;text-align:center;min-width:46px}
.stat b{display:block;font-size:17px;color:var(--ink)}
.stat span{font-size:11px;color:var(--ink-soft)}
.mute{background:var(--panel);color:var(--ink);width:44px;min-height:46px;font-size:20px;box-shadow:none;border-radius:14px}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{position:relative}
.tile{
  position:absolute;border-radius:9px;cursor:pointer;
  background:linear-gradient(145deg,#fffdf3 0%,#f6edd2 60%,#eadcb4 100%);
  box-shadow:inset 0 0 0 1.5px rgba(120,95,40,.35),inset 0 2px 3px rgba(255,255,255,.9),
    3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2),5px 8px 10px rgba(0,0,0,.45);
  transition:transform .12s ease,filter .15s ease,opacity .25s ease;
  padding:3px 4px;
}
.tile svg{width:100%;height:100%;display:block;pointer-events:none}
.tile.blocked{filter:brightness(.58) saturate(.7)}
.nodim .tile.blocked{filter:brightness(.66) saturate(.8)}
.tile.sel{
  transform:translateY(-4px);filter:none;
  box-shadow:inset 0 0 0 3px var(--accent),inset 0 2px 3px rgba(255,255,255,.9),3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2),0 0 18px 4px var(--accent);
}
.tile.hint{animation:pulse .6s ease-in-out 4}
@keyframes pulse{50%{transform:translateY(-5px) scale(1.06);filter:none;box-shadow:inset 0 0 0 3px #ff6a3d,3px 4px 0 var(--edge),0 0 20px 6px rgba(255,106,61,.9)}}
.tile.gone{opacity:0;transform:scale(.6) rotate(8deg);pointer-events:none}
.tile.hidden{display:none}
.board-in .tile{animation:tin .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes tin{from{opacity:0;transform:translateY(-30px) scale(.7)}to{opacity:1;transform:none}}
.tile.locked{
  background:linear-gradient(145deg,#4f4a82,#2a2552 70%,#1f1b40);
  box-shadow:inset 0 0 0 1.5px rgba(255,207,90,.55),inset 0 2px 3px rgba(255,255,255,.18),
    3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2),5px 8px 10px rgba(0,0,0,.45);
}
.tile.locked.blocked{filter:none}
.tile.unlock{animation:flip .7s cubic-bezier(.2,1.2,.4,1) both,glow 1s ease-out}
@keyframes flip{from{transform:perspective(300px) rotateY(90deg) scale(.8)}to{transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 #fff,0 0 30px 10px var(--accent)}100%{}}
.reset{margin:18px auto 8px;min-height:48px;padding:6px 20px;background:transparent;color:var(--ink);border:2px solid var(--ink-soft);box-shadow:none;flex-direction:row;font-size:14px;flex-shrink:0}
.sec{grid-column:1/-1;text-align:center;color:var(--accent);font-weight:700;font-size:15px;margin:8px 0 0}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 12px 12px}
button{
  font:inherit;font-weight:700;font-size:14px;color:var(--btn-ink);background:var(--btn);
  border:0;border-radius:14px;min-height:56px;padding:5px 2px;
  box-shadow:0 4px 0 var(--btn-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
}
button i{font-style:normal;font-size:19px;line-height:1.1}
button em{font-style:normal;font-size:11px;font-weight:600;opacity:.75}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-shadow)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%) translateY(-20px);
  background:rgba(0,0,0,.78);color:#fff;padding:9px 16px;border-radius:20px;font-size:15px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:5000;text-align:center;max-width:90%;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* overlay */
.ov{position:fixed;inset:0;display:none;z-index:8000}
.ov.show{display:flex}
#menu{
  flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--felt-b);background-image:radial-gradient(ellipse at 50% 20%,var(--felt-a),var(--felt-b) 80%);
}
#menu h2{margin:6px 0 2px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:30px;color:var(--accent);letter-spacing:.5px}
#menu p{margin:0 0 14px;text-align:center;color:var(--ink-soft);font-size:15px}
#close{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:46px;min-height:46px;font-size:20px;background:var(--panel);color:var(--ink);box-shadow:none;border-radius:50%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lcard{
  position:relative;min-height:104px;border-radius:18px;color:#fff;text-align:left;align-items:flex-start;justify-content:space-between;
  padding:10px 12px;border:3px solid;box-shadow:0 5px 0 rgba(0,0,0,.35);overflow:hidden;
}
.lcard b{font-size:30px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);font-family:Georgia,serif}
.lcard span{font-size:15px;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.lcard .stars{font-size:18px;letter-spacing:2px;color:#ffd84a;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.lcard .stars s{text-decoration:none;color:rgba(255,255,255,.35)}
.lcard small{font-size:11px;opacity:.9}
.lcard.locked{filter:grayscale(.85) brightness(.6)}
.lcard.locked::after{content:"🔒";position:absolute;right:10px;top:8px;font-size:22px}
.lcard.cur{outline:3px solid #fff;outline-offset:2px}
#win{z-index:9000;background:rgba(5,15,12,.78);align-items:center;justify-content:center;padding:20px}
#fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card{
  position:relative;z-index:1;background:linear-gradient(145deg,#fffdf3,#f1e5c0);color:var(--btn-ink);border-radius:22px;
  padding:22px 20px;text-align:center;max-width:330px;width:100%;
  box-shadow:6px 8px 0 var(--edge2),0 20px 40px rgba(0,0,0,.5);border-top:8px solid var(--accent);
  animation:cardIn .6s cubic-bezier(.2,1.4,.4,1) both;
}
.card .trophy{font-size:54px;line-height:1.1;display:inline-block;animation:trophy 1.2s ease-in-out infinite}
.card h3{margin:2px 0 0;font-family:Georgia,serif;font-size:26px}
.card .sub{margin:2px 0 6px;font-size:15px;color:#7a6a4a}
.card .starrow{font-size:44px;line-height:1.1;margin:4px 0}
.card .st{display:inline-block;color:#d8cfb4;margin:0 2px}
.card .st.on{color:#ffb400;text-shadow:0 2px 0 #b97800;opacity:0;animation:starpop .6s cubic-bezier(.2,1.6,.4,1) forwards}
.card p{margin:4px 0 10px;font-size:16px}
.card button{width:100%;margin-top:8px;font-size:17px;min-height:52px}
.card button.pri{background:var(--edge2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.card .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@keyframes cardIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes trophy{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg) scale(1.1)}}
@keyframes starpop{0%{opacity:0;transform:scale(0) rotate(-90deg)}70%{opacity:1;transform:scale(1.5) rotate(15deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.lv small{max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langs{display:flex;justify-content:center;gap:8px;margin:0 0 14px}
.langs button{min-height:42px;padding:4px 14px;font-size:14px;flex-direction:row;gap:6px;background:var(--panel);color:var(--ink);box-shadow:none;border:2px solid transparent;border-radius:12px}
.langs button.on{border-color:var(--accent);background:rgba(255,255,255,.16)}
#intro{z-index:8500;background:rgba(5,15,12,.8);align-items:center;justify-content:center;padding:18px}
#intro .card{max-height:92%;overflow-y:auto}
#intro ul{text-align:left;margin:6px 0 4px;padding-left:20px;font-size:15.5px;line-height:1.38}
#intro li{margin:6px 0}
.vis{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 6px;min-height:76px;flex-wrap:wrap}
.vis .vt{font-size:34px;font-weight:700;color:#7a6a4a;line-height:1}
.mt{width:50px;height:65px;border-radius:9px;background:linear-gradient(145deg,#fffdf3,#f6edd2 60%,#eadcb4);padding:3px 4px;flex-shrink:0;
  box-shadow:inset 0 0 0 1.5px rgba(120,95,40,.35),inset 0 2px 3px rgba(255,255,255,.9),3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2)}
.mt.locked{background:linear-gradient(145deg,#4f4a82,#2a2552 70%,#1f1b40);box-shadow:inset 0 0 0 1.5px rgba(255,207,90,.55),3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2)}
.mt svg{width:100%;height:100%;display:block}
.stackvis{position:relative;width:90px;height:96px}
.stackvis .mt{position:absolute}
.card .small{font-size:13px;color:#7a6a4a;margin:0 0 4px}
header{gap:6px}
.stats{gap:5px}
.stat{min-width:42px;padding:4px 6px}
.stat.clk{cursor:pointer}
.stat.clk span{white-space:nowrap}
.lv{min-width:0;flex:1 1 auto;max-width:150px;padding:2px 8px;font-size:15px;overflow:hidden}
.lv span{white-space:nowrap}
.mute{width:40px;min-height:44px;flex-shrink:0;font-size:19px}
.resumebtn{width:100%;margin:0 0 14px;border:3px solid;border-radius:18px;color:#fff;min-height:78px;padding:12px 14px;align-items:flex-start;text-align:left;gap:3px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.resumebtn b{font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.resumebtn span{font-size:14px;font-weight:600;opacity:.95}
#pause{z-index:8600;background:var(--felt-b);background-image:radial-gradient(ellipse at 50% 35%,var(--felt-a),var(--felt-b) 80%);align-items:center;justify-content:center;padding:20px}
#guide{z-index:8400;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--felt-b);background-image:radial-gradient(ellipse at 50% 20%,var(--felt-a),var(--felt-b) 80%)}
#guide h2{margin:6px 0 2px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:28px;color:var(--accent)}
#guide p{margin:0 0 10px;text-align:center;color:var(--ink-soft);font-size:14px}
#guideList{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding:2px 2px 10px}
.gitem{background:linear-gradient(145deg,#fffdf3,#f1e5c0);color:var(--btn-ink);border-radius:18px;padding:14px 16px;border-top:6px solid var(--accent);box-shadow:4px 6px 0 var(--edge2);flex-shrink:0}
.gitem h4{margin:0;font-family:Georgia,serif;font-size:20px}
.gitem .sub{font-size:13px;color:#7a6a4a;margin:2px 0 4px}
.gitem ul{text-align:left;margin:6px 0 2px;padding-left:20px;font-size:15px;line-height:1.38}
.gitem li{margin:5px 0}
.gitem.lockedg{opacity:.55}
.okbtn{width:100%;background:var(--edge2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.45);min-height:52px;font-size:17px;margin-top:8px;flex-shrink:0}
#settings{z-index:8300;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--felt-b);background-image:radial-gradient(ellipse at 50% 20%,var(--felt-a),var(--felt-b) 80%)}
#settings h2{margin:6px 0 8px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:28px;color:var(--accent)}
#setBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding:2px 2px 10px}
.sgroup{background:rgba(0,0,0,.28);border-radius:16px;padding:12px 14px;flex-shrink:0}
.sgroup h4{margin:0 0 6px;color:var(--accent);font-size:16px;letter-spacing:.3px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.08)}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.slabel{font-size:15.5px;color:var(--ink);flex:1}
.slabel small{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;font-weight:400;line-height:1.3}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.swatch{background-origin:border-box;background-repeat:no-repeat;width:44px;min-height:44px;height:44px;padding:0;border-radius:50%;border:3px solid transparent;box-shadow:0 2px 0 rgba(0,0,0,.4);flex-direction:row;color:#fff;font-size:18px}
.swatch.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
.swatch.auto{background:conic-gradient(#1f6b57,#1f6f94,#b0476f,#bf5d2c,#6038a6,#1f6b57)}
.sw{width:58px;min-height:34px;height:34px;padding:0;border-radius:17px;background:rgba(255,255,255,.25);box-shadow:none;position:relative;flex-shrink:0;display:block}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:27px}
.sw:active{transform:none}
#setVol{width:100%;accent-color:var(--accent);height:34px;margin:0}
#settings .langs{margin:6px 0 2px}
#selbar{display:none;align-items:center;justify-content:center;gap:10px;padding:2px 12px 4px;min-height:60px;flex-shrink:0}
.sbslots{display:flex;align-items:center;gap:6px}
.sbslot{width:42px;height:54px;flex-shrink:0}
.sbslot.empty{border:2px dashed rgba(255,255,255,.35);border-radius:9px}
.sbslot .mt{width:42px;height:54px;padding:2px 3px}
.sbstat{width:24px;text-align:center;font-size:20px;font-weight:800;color:#fff}
.sbname{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbrec{display:flex;gap:4px;flex-shrink:0}
.sbrec .mt{width:24px;height:31px;padding:1px 2px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(120,95,40,.35)}
/* testi e pulsanti grandi */
.bigui header{flex-wrap:wrap}
.bigui nav button{min-height:72px;font-size:15px;padding:5px 1px}
.bigui nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigui nav button i{font-size:24px}
.bigui #toast{font-size:18px;padding:11px 18px}
.bigui .stat b{font-size:19px}
.bigui .lv{font-size:17px}
.bigui .card p,.bigui #intro ul,.bigui .gitem ul,.bigui .slabel{font-size:17.5px}
.bigui .lcard span{font-size:17px}
/* segnali che non dipendono dal colore + contrasto alto */
.cb .tile.blocked::after,.hc .tile.blocked::after{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(0,0,0,.4) 0 5px,transparent 5px 11px)}
.cb .tile.sel,.hc .tile.sel{outline:5px solid #fff;outline-offset:2px}
.cb .tile.hint,.hc .tile.hint{outline:4px dashed #fff;outline-offset:3px}
.hc{--ink:#fff;--ink-soft:#fff}
.hc .tile{background:#fff;box-shadow:inset 0 0 0 3px #000,3px 4px 0 var(--edge),3px 4px 0 1px #000,5px 8px 10px rgba(0,0,0,.6)}
.hc .tile svg>circle:first-child{fill:#fff}
.hc .tile.blocked{filter:brightness(.4) contrast(1.15)}
.hc .tile.locked{background:#1b1740;box-shadow:inset 0 0 0 3px #ffd34a,3px 4px 0 var(--edge),3px 4px 0 1px #000}
.hc .stat,.hc .lv,.hc .mute{background:rgba(0,0,0,.65)}
.hc button{border:2px solid #000}
.tile.blocker{filter:none;outline:4px solid #ff4d4d;outline-offset:2px;animation:blk .55s ease-in-out 3}
@keyframes blk{50%{transform:translateY(-4px) scale(1.05)}}
.tile.target{animation:shake .42s ease-in-out}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cb .tile.blocker,.hc .tile.blocker{outline:5px double #fff}
/* tessere uguali alla selezionata: anello verde con ✔ e leggero respiro; le altre libere si abbassano di luce */
.tile.match,.hc .tile.match{z-index:5000!important;filter:none;transform:translateY(-3px);animation:mglow 1.3s ease-in-out infinite;
  box-shadow:inset 0 0 0 3px #1fbf5a,0 0 0 4px #fff,0 0 0 8px #1fbf5a,0 0 26px 10px rgba(255,255,255,.7),3px 4px 0 var(--edge)}
@keyframes mglow{50%{transform:translateY(-6px) scale(1.06)}}
.tile.match::before{content:"✔";position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;background:#1fbf5a;color:#fff;
  font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 2px 5px rgba(0,0,0,.45);z-index:2;pointer-events:none}
.cb .tile.match,.hc .tile.match{box-shadow:inset 0 0 0 4px #000,0 0 0 4px #fff,0 0 0 8px #000,0 0 26px 10px rgba(255,255,255,.7),3px 4px 0 var(--edge)}
.cb .tile.match::before,.hc .tile.match::before{background:#000;border-radius:7px;box-shadow:0 0 0 3px #fff}
.tile.fade{filter:brightness(.8) saturate(.75)}
#map{z-index:7900;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#0f4a6b 0%,#146b7a 45%,#1d8a6a 100%)}
#map h2{margin:6px 0 2px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:30px;color:#ffe9a8}
#map>p{margin:0 0 12px;text-align:center;color:#d6f1ff;font-size:15px}
#mapClose{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:46px;min-height:46px;font-size:20px;background:rgba(0,0,0,.3);color:#fff;box-shadow:none;border-radius:50%}
#mapPath{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.isl{display:flex;flex-direction:column;align-items:center;width:100%}
.isl.left{padding-right:70px}.isl.right{padding-left:70px}
.islbtn{width:108px;min-height:108px;height:108px;padding:0;border-radius:50%;border:4px solid rgba(255,255,255,.9);font-size:50px;color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.28),0 0 24px rgba(255,255,255,.25);flex-direction:row}
.islname{margin-top:8px;font-weight:800;color:#fff;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center}
.islsub{font-size:13px;color:#e4f6ff;margin-top:1px}
.isl.locked .islbtn{filter:grayscale(.85) brightness(.7);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.isl.locked .islname{opacity:.8}
.isl.locked .islbtn::after{content:"🔒";position:absolute;font-size:24px;right:-4px;top:-2px}
.islbtn{position:relative}
.isl.shake{animation:shake .45s ease-in-out}
.conn{width:6px;height:30px;border-radius:3px;margin:2px 0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.75) 0 6px,transparent 6px 12px)}
.mapfoot{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

  function layoutList(n,comfort){
    var a=[];
    if(n>BASE_LV){ISL_SHAPES[n-BASE_LV-1](a); if(a.length%2)a.pop(); return a;}
    var b=(n-1)%BASE_LV;
    if(comfort&&COMFORT[b]){COMFORT[b](a); if(a.length%2)a.pop();}
    else LEVELS[b].build(a);
    return a;
  }

      if(cf.hid)c.hid=cf.hid.slice(); else delete c.hid;

  function toneRaw(f,t0,dur,type,vol,to){

    var o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,(vol||.15)*S.vol/100),t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);

  }

  function isFree(t,alive){
    var left=false,right=false,i,u;
    for(i=0;i<alive.length;i++){
      u=alive[i]; if(u===t)continue;
      if(u.z===t.z+1&&Math.abs(u.x-t.x)<1&&Math.abs(u.y-t.y)<1)return false;
      if(u.z===t.z&&Math.abs(u.y-t.y)<1){
        if(u.x<t.x&&t.x-u.x<2)left=true;
        if(u.x>t.x&&u.x-t.x<2)right=true;
      }
    }
    return !(left&&right);
  }
  function shuffleArr(a){
    for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
    return a;
  }
  function makeGroups(n2,K2){
    var g=[],q,p,i;
    if(n2<=0)return g;
    K2=Math.max(1,Math.min(K2,n2));
    if(K2*2>=n2){q=n2-K2;p=2*K2-n2;} else {q=Math.floor(n2/2);p=n2%2;}
    for(i=0;i<q;i++)g.push(4);
    for(i=0;i<p;i++)g.push(2);
    return g;
  }
  // Assegna i disegni in gruppi da 4 tessere uguali (tutte libere nello stesso momento):
  // cosi' ci sono sempre molte mosse possibili. Le stelle sono sempre le prime ad essere giocabili.
  function assign(list,ntypes,unl0,GG){
    unl0=unl0||0; GG=GG||0;
    var n=list.length/2, need=Math.max(0,GG-unl0), attempt, i;
    var allT=poolOf(lv).slice();
    for(attempt=0;attempt<1500;attempt++){
      var starG=[], pairsLeft=n, c=need, sz;
      while(c>0&&pairsLeft>0){
        sz=(pairsLeft>=2)?4:2;
        starG.push({size:sz,star:true,type:STAR_IDX});
        pairsLeft-=sz/2; c-=sz/2;
      }
      var pool=allT.filter(function(k){return need?k!==STAR_IDX:true;});
      var K2=Math.max(1,Math.min(need?ntypes-1:ntypes,pairsLeft));
      var order=shuffleArr(pool).slice(0,K2);
      var rest=makeGroups(pairsLeft,K2); shuffleArr(rest);
      var seq=rest.map(function(z,k){return {size:z,star:false,type:order[k%order.length]};});
      starG.slice(1).forEach(function(sg){
        var pos=Math.floor(Math.random()*Math.ceil((seq.length+1)*.4));
        seq.splice(pos,0,sg);
      });
      if(starG.length)seq.unshift(starG[0]);
      var al=list.slice(), ok=true, res=[], u=unl0;
      for(i=0;i<seq.length;i++){
        var g=seq[i];
        var free=al.filter(function(t){return (t.hid||0)<=u&&isFree(t,al);});
        if(free.length<g.size){ok=false;break;}
        free.forEach(function(t){t._k=t.z+Math.random()*1.6;});
        free.sort(function(a,b){return b._k-a._k;});
        var pick=free.slice(0,g.size);
        res.push([pick,g.type]);
        pick.forEach(function(t){al.splice(al.indexOf(t),1);});
        if(g.star&&u<GG)u=Math.min(GG,u+g.size/2);
      }
      if(ok){res.forEach(function(r){r[0].forEach(function(t){t.type=r[1];});});return true;}
    }
    var o2=shuffleArr(allT).slice(0,ntypes);
    list.forEach(function(t,k){t.type=o2[Math.floor(k/2)%o2.length];});
    return false;
  }

    document.getElementById('bIntroOk').textContent=tx('ok');
    buildVis(n);
    var ov=document.getElementById('intro');
    ov.classList.remove('show'); void ov.offsetWidth; ov.classList.add('show');
    document.getElementById('bIntroOk').onclick=function(){
      prog.seen[n]=true; saveProg(); ov.classList.remove('show'); if(cb)cb();
    };
  }

  // ================= AVVIO LIVELLO =================
  function startLevel(n,saved){
    lv=n; cfg=LEVELS[n-1];
    stopFx(); closeMenu(true); closeMap(true);
    document.getElementById('win').classList.remove('show');
    document.getElementById('intro').classList.remove('show');
    document.getElementById('pause').classList.remove('show');
    document.getElementById('guide').classList.remove('show');
    applyTheme(cfg);
    document.getElementById('lvNum').textContent=tx('lvShort',{n:localLv(n)});
    document.getElementById('lvName').textContent=lvTitle(n);
    curCf=saved?!!saved.cm:!!S.cf;
    var list=layoutList(n,curCf);
    tiles=list; tiles.forEach(function(t){t.gone=false;t.hid=0;t.gold=false;});
    if(saved){
      saved.t.forEach(function(r,i){var t=tiles[i]; t.type=r[0]; t.hid=r[1]; t.gone=!!r[2]; t.gold=!!r[3];});
      unl=saved.unl||0; goldGot=saved.gg||0;
    } else {
      if(cfg.hid)markHidden(tiles,cfg.hid);
      unl=0;
      assign(tiles,nEff(),0,G());
      if(cfg.gold)markGold(tiles,cfg.gold);
      goldGot=0;
    }
    goldTotal=tiles.filter(function(t){return t.gold;}).length;
    over=false; started=true; sel=null; combo=0; lastMatch=0; sbRecent=[]; sbShow(null,null,'');
    if(saved){
      secs=saved.secs||0; hintsUsed=saved.hu||0; undosUsed=saved.uu||0; shufUsed=saved.su||0; shufBarrier=!!saved.sb;
      hintsLeft=saved.hl; shufLeft=saved.sl; undoLeft=saved.ul;
      history=(saved.h||[]).map(function(r){return [tiles[r[0]],tiles[r[1]],r[2]];}).filter(function(p){return p[0]&&p[1];});
    } else {
      history=[]; secs=0;
      hintsUsed=0; undosUsed=0; shufUsed=0; shufBarrier=false;
      hintsLeft=curCf?null:cfg.hints; shufLeft=curCf?null:cfg.shuf; undoLeft=curCf?null:cfg.undo;
    }
    counts();
    showTime();
    board.innerHTML=''; board.classList.toggle('nodim',!cfg.dim);
    board.classList.remove('board-in');
    tiles.forEach(function(t){
      var d=document.createElement('div'); d.className='tile'+(t.gone?' gone hidden':''); t.el=d;
      d.addEventListener('click',function(){tap(t);});
      paintTile(t); board.appendChild(d);
    });
    showGold();
    layout(); refresh();
    void board.offsetWidth; board.classList.add('board-in');
    SND.start();
    stopTimer();
    if(needIntro(n)){
      showIntro(n,function(){startTimer();});
    } else {
      startTimer();
      if(cfg.hid&&!saved)toast(tx('tHiddenStart'),4200);
    }
    setTimeout(function(){board.classList.remove('board-in');},1800);
    saveGame();
    if(saved&&alive().length&&!findMove())rescue();
  }

  // ================= MENU =================
  var menu=document.getElementById('menu');
  function buildResume(rb){
    rb.innerHTML='';
    var sv=(!started)?readSave():null;
    if(sv){
      var cs=LEVELS[sv.lv-1], left=sv.t.filter(function(r){return !r[2];}).length/2;
      var rbtn=document.createElement('button'); rbtn.className='resumebtn';
      rbtn.style.background='linear-gradient(145deg,'+cs.th[0]+','+cs.th[1]+')'; rbtn.style.borderColor=cs.th[2];
      rbtn.innerHTML='<b>'+tx('continueGame')+'</b><span>'+tx('continueInfo',{n:localLv(sv.lv),name:lvTitle(sv.lv),t:fmt(sv.secs||0),p:left})+'</span>';
      rbtn.addEventListener('click',function(){ac();startLevel(sv.lv,sv);});
      rb.appendChild(rbtn);
    }
  }
  var curWorld='prologue';
  function buildMenu(){
    buildResume(document.getElementById('resumeBox'));
    var W=ISLANDS.filter(function(x){return x.id===curWorld;})[0]||ISLANDS[0];
    document.getElementById('islTitle').textContent=W.icon+' '+tx('isl_'+W.id);
    var g=document.getElementById('grid'); g.innerHTML='';
    LEVELS.forEach(function(L,i){
      var n=i+1, loc=n-W.levels[0]+1;
      if(n<W.levels[0]||n>W.levels[1])return;
      if(loc===1||loc===11){
        var h=document.createElement('div'); h.className='sec';
        h.textContent=loc===1?tx('secClassic'):tx('secHidden');
        g.appendChild(h);
      }
      var b=document.createElement('button'), st=prog.stars[n]||0, locked=n>prog.unlocked;
      b.className='lcard'+(locked?' locked':'')+(started&&n===lv?' cur':'');
      b.style.background='linear-gradient(145deg,'+L.th[0]+','+L.th[1]+')';
      b.style.borderColor=L.th[2];
      var s=''; for(var k=0;k<3;k++)s+=(k<st?'★':'<s>★</s>');
      var gTot=(prog.goldTot||{})[n]||0, gGot=(prog.gold||{})[n]||0;
      b.innerHTML='<b>'+loc+'</b>'+(L.diff?'<i class="dif" title="'+tx('diffLbl')+'">'+'●'.repeat(L.diff)+'○'.repeat(5-L.diff)+'</i>':'')+(L.boss?'<u class="bossb" title="Boss">👑</u>':'')+'<span>'+lname(n)+'</span><div class="stars">'+s+(gTot?'<em>✨'+gGot+'/'+gTot+'</em>':'')+'</div>'+
        '<small>'+(prog.best[n]?tx('record',{t:fmt(prog.best[n])}):(locked?tx('lockedLv'):fmtInfo(L)))+'</small>';
      b.addEventListener('click',function(){
        if(locked){SND.blocked();return;} ac(); startLevel(n);
      });
      g.appendChild(b);
    });
  }
  function fmtInfo(L){
    var a=layoutList(LEVELS.indexOf(L)+1,!!S.cf);
    return tx('pairsInfo',{n:a.length/2})+(L.hid?' · 🔒'+L.hid.reduce(function(x,y){return x+y;},0):'');
  }

  // ---------- mappa del viaggio ----------
  var map=document.getElementById('map');
  function totalStars(W){var t=0,k,lo=W?W.levels[0]:1,hi=W?W.levels[1]:999;for(k in prog.stars){k=+k; if(k>=lo&&k<=hi)t+=prog.stars[k]||0;}return t;}
  function worldOpen(I){return I.id==='prologue'||(I.id==='animals'&&prog.unlocked>BASE_LV);}
  function buildMap(){
    buildResume(document.getElementById('resumeBoxMap'));
    var p=document.getElementById('mapPath'); p.innerHTML='';
    ISLANDS.forEach(function(I,i){
      if(i>0){var c=document.createElement('div'); c.className='conn'; p.appendChild(c);}
      var open=worldOpen(I), soon=!I.levels;
      var d=document.createElement('div'); d.className='isl '+(i%2?'right':'left')+(open?'':' locked'); d.setAttribute('data-id',I.id);
      var b=document.createElement('button'); b.className='islbtn'; b.id='isl_'+I.id;
      b.style.background='linear-gradient(145deg,'+I.th[0]+','+I.th[1]+')';
      var lockTxt=soon?tx('mapSoon'):tx('mapNeedPrologue');
      b.setAttribute('aria-label',tx('isl_'+I.id)+(open?'':' ('+lockTxt+')'));
      b.innerHTML='<span>'+I.icon+'</span>';
      var nm=document.createElement('div'); nm.className='islname'; nm.textContent=tx('isl_'+I.id);
      var sb=document.createElement('div'); sb.className='islsub';
      sb.textContent=open?tx('mapProgress',{a:totalStars(I),b:(I.levels[1]-I.levels[0]+1)*3}):lockTxt;
      b.onclick=function(){
        if(open){ac();SND.select();openMenu(I.id);}
        else{SND.blocked();d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
      };
      d.appendChild(b); d.appendChild(nm); d.appendChild(sb); p.appendChild(d);
    });
  }
  function openMap(){
    stopTimer(); buildMap();
    document.getElementById('mapClose').style.display=started&&!over?'':'none';
    map.classList.add('show');
  }
  function closeMap(silent){
    map.classList.remove('show');
    if(!silent&&started&&!over&&!menu.classList.contains('show')&&!document.getElementById('intro').classList.contains('show')&&!document.getElementById('guide').classList.contains('show')&&!document.getElementById('settings').classList.contains('show'))startTimer();
  }
  function openMenu(wid){
    curWorld=wid||(started?islandOf(lv).id:curWorld);
    stopTimer(); buildMenu();
    document.getElementById('close').style.display=started&&!over?'':'none';
    menu.classList.add('show');
  }
  function closeMenu(silent){
    menu.classList.remove('show');
    if(!silent&&started&&!over&&!map.classList.contains('show')&&!document.getElementById('intro').classList.contains('show')&&!document.getElementById('guide').classList.contains('show')&&!document.getElementById('settings').classList.contains('show'))startTimer();
  }

  // ================= PULSANTI =================
  document.addEventListener('pointerdown',function(){ac();},{once:true});
  document.getElementById('bLevel').onclick=function(){stopFx();document.getElementById('win').classList.remove('show');openMenu(started?islandOf(lv).id:undefined);};
  document.getElementById('bMapBack').onclick=function(){menu.classList.remove('show');buildMap();map.classList.add('show');document.getElementById('mapClose').style.display=started&&!over?'':'none';};
  document.getElementById('mapClose').onclick=function(){closeMap();};
  document.getElementById('bSetMap').onclick=function(){openSettings();};
  document.getElementById('bGuideMap').onclick=function(){openGuide();};
  document.getElementById('close').onclick=function(){closeMenu();};
  document.getElementById('bMenu').onclick=function(){stopFx();document.getElementById('win').classList.remove('show');openMenu(islandOf(lv).id);};
  document.getElementById('bAgain').onclick=function(){startLevel(lv);};
  document.getElementById('bNext').onclick=function(){
    if(lv===BASE_LV){stopFx();document.getElementById('win').classList.remove('show');openMap();return;}   // fine dei livelli iniziali: si va al viaggio
    startLevel(Math.min(lv+1,LEVELS.length));
  };
  document.getElementById('bNew').onclick=function(){startLevel(lv);};
  document.getElementById('bHint').onclick=function(){
    if(over)return;
    if(hintsLeft!==null&&hintsLeft<=0){toast(tx('tNoHints'));SND.blocked();return;}
    var m=findMove();
    if(!m){rescue();return;}
    if(hintsLeft!==null)hintsLeft--; hintsUsed++; counts(); SND.hint(); saveGame();
    m[0].el.classList.remove('hint'); m[1].el.classList.remove('hint'); void m[0].el.offsetWidth;
    m[0].el.classList.add('hint'); m[1].el.classList.add('hint');
  };
  document.getElementById('bUndo').onclick=function(){
    if(over)return;
    if(!history.length){toast(tx(shufBarrier?'tNoUndoShuffle':'tNoUndoHist'));return;}
    if(undoLeft!==null&&undoLeft<=0){toast(tx('tNoUndo'));SND.blocked();return;}
    if(undoLeft!==null)undoLeft--; undosUsed++; counts(); SND.undo();
    var p=history.pop();
    if(p[2]){unl=p[2]-1; tiles.forEach(function(t){if(t.hid===p[2])paintTile(t);});}
    p[0].gone=false;p[1].gone=false;
    goldGot=Math.max(0,goldGot-((p[0].gold?1:0)+(p[1].gold?1:0))); showGold();
    [p[0],p[1]].forEach(function(t){t.el.classList.remove('gone','hidden');});
    sel=null; refresh(); saveGame(); sbRecent.pop(); sbShow(null,null,'');
  };
  document.getElementById('bShuf').onclick=function(){
    if(over)return;
    if(shufLeft!==null&&shufLeft<=0){toast(tx('tNoShuf'));SND.blocked();return;}
    var al=alive(); if(al.length<2)return;
    if(shufLeft!==null)shufLeft--; shufUsed++; counts();
    assign(al,nEff(),unl,G()); sel=null;
    history=[]; shufBarrier=true;   // dopo un rimescolo non si torna indietro: la partita resta risolvibile
    al.forEach(paintTile); refresh();
    SND.shuffle(); toast(tx('tShuffled')); saveGame(); sbShow(null,null,'');
  };
  var rsArm=false, rsT;
  var resetB=document.getElementById('bReset');
  function resetLabel(){rsArm=false;resetB.textContent=tx('reset');}
  resetB.onclick=function(){
    if(!rsArm){
      rsArm=true; resetB.textContent=tx('resetConfirm');
      clearTimeout(rsT); rsT=setTimeout(resetLabel,3500); return;
    }
    clearTimeout(rsT);
    prog={unlocked:1,stars:{},best:{},seen:{}}; saveProg(); clearSave();
    try{localStorage.removeItem('mj_prog2');}catch(e){}
    SND.start(); buildMenu(); if(map.classList.contains('show'))buildMap();
    rsArm=false; resetB.textContent=tx('resetDone');
    rsT=setTimeout(resetLabel,2200);
  };
  // ---------- guida ----------
  var guideWasOn=false;
  function openGuide(){
    guideWasOn=timerOn; stopTimer();
    var list=document.getElementById('guideList'); list.innerHTML='';
    var ns=Object.keys(INTRO_VIS).map(Number).sort(function(a,b){return a-b;});
    var reach=Math.max(prog.unlocked, started?lv:1), cur=started?lv:reach, target=null;
    ns.forEach(function(n){
      var d=document.createElement('div'); d.className='gitem'; d.setAttribute('data-n',n);
      if(n>reach){ d.className+=' lockedg'; d.innerHTML='<h4>'+tx('guideLocked',{n:(n>BASE_LV?islandOf(n).icon+' ':'')+localLv(n)})+'</h4>'; }
      else {
        var it=I18N[lang].intro[n]||I18N.fr.intro[n];
        d.innerHTML='<h4>'+(INTRO_ICON[n]||'✨')+' '+it.t+'</h4><div class="sub">'+(n>BASE_LV?islandOf(n).icon+' ':'')+tx('newIn',{n:localLv(n)})+'</div><div class="vis"></div><ul>'+
          it.l.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
        buildVis(n,d.querySelector('.vis'));
        if(n<=cur)target=d;
      }
      list.appendChild(d);
    });
    setTxt('guideTitle','guideTitle'); setTxt('guideSub','guideSub'); setTxt('bGuideOk','ok');
    document.getElementById('guide').classList.add('show');
    if(target)setTimeout(function(){try{list.scrollTop=target.offsetTop-list.offsetTop-4;}catch(e){}},30);
  }
  function closeGuide(){
    document.getElementById('guide').classList.remove('show');
    if(guideWasOn&&started&&!over&&!menu.classList.contains('show'))startTimer();
    guideWasOn=false;
  }
  document.getElementById('bGuide').onclick=openGuide;
  document.getElementById('bGuideMenu').onclick=openGuide;
  document.getElementById('bGuideOk').onclick=closeGuide;
  // ---------- pausa / salvataggio automatico ----------
  var pauseB=document.getElementById('bPause');
  pauseB.onclick=pauseGame;
  pauseB.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pauseGame();}});
  document.getElementById('bResume').onclick=unpause;
  document.addEventListener('visibilitychange',function(){if(document.hidden){pauseGame();saveGame();}});
  window.addEventListener('pagehide',function(){saveGame();});
  // ---------- impostazioni ----------
  var setWasOn=false;
  function applySettings(){
    var c=document.body.classList;
    c.toggle('bigui',eff('ui')); c.toggle('nofx',!S.fx); showTime(); c.toggle('hc',!!S.hc); c.toggle('cb',!!(S.cb||S.hc));
    sbEl('selbar').style.display=S.bar?'flex':'none';
    applyTheme(cfg);
    if(S.bar)sbShow(sel,null,'');
    if(tiles.length&&tiles[0].el)refresh();
    armIdle();
    clearTimeout(applySettings.t); applySettings.t=setTimeout(layout,40);
  }
  function setLang(l){
    if(!I18N[l])return;
    lang=l; try{localStorage.setItem('mj_lang',l);}catch(e){}
    applyLang(); SND.select();
  }
  function buildSettings(){
    var body=document.getElementById('setBody'); body.innerHTML='';
    setTxt('setTitle','setTitle'); setTxt('bSetOk','ok');
    function group(key){var g=document.createElement('div');g.className='sgroup';var h=document.createElement('h4');h.textContent=tx(key);g.appendChild(h);body.appendChild(g);return g;}
    function row(g,lk,hk,cls){
      var r=document.createElement('div'); r.className='srow'+(cls?' '+cls:'');
      var l=document.createElement('div'); l.className='slabel'; l.textContent=tx(lk);
      if(hk){var sm=document.createElement('small'); sm.textContent=tx(hk); l.appendChild(sm);}
      r.appendChild(l); g.appendChild(r); return r;
    }
    function sw(r,lk,on,fn){
      var b=document.createElement('button'); b.className='sw'; b.setAttribute('role','switch');
      b.setAttribute('aria-checked',on?'true':'false'); b.setAttribute('aria-label',tx(lk));
      b.onclick=function(){var nv=b.getAttribute('aria-checked')!=='true'; b.setAttribute('aria-checked',nv?'true':'false'); fn(nv);};
      r.appendChild(b);
    }
    function swatches(g,lk,keys,pal,cur,pick){
      var r=row(g,lk,null,'col'), c=document.createElement('div'); c.className='swatches'; r.appendChild(c);
      keys.forEach(function(k){
        var b=document.createElement('button'); b.className='swatch'+(k==='level'?' auto':'')+(cur===k?' on':'');
        if(k==='level'){b.textContent='↺'; b.setAttribute('aria-label',tx('setLevelTheme')); b.title=tx('setLevelTheme');}
        else{var p=pal[k]; b.style.background='linear-gradient(145deg,'+p[0]+','+p[1]+')'; b.setAttribute('aria-label',k);}
        b.setAttribute('data-k',k);
        b.onclick=function(){pick(k); Array.prototype.forEach.call(c.children,function(x){x.classList.remove('on');}); b.classList.add('on');};
        c.appendChild(b);
      });
    }
    var g=group('sgApp');
    swatches(g,'slBg',['level'].concat(Object.keys(BGP)),BGP,S.bg,function(k){S.bg=k;saveSettings();applyTheme(cfg);});
    swatches(g,'slTile',['level'].concat(Object.keys(TLP)),TLP,S.tile,function(k){S.tile=k;saveSettings();applyTheme(cfg);});
    g=group('sgComfort');
    [['cf','setCf','setCfHint'],['ui','setBigUi',null],['hc','setHc','setHcHint'],['cb','setCb','setCbHint'],['nt','setNoTime','setNoTimeHint'],['bar','setSelBar','setSelBarHint']].forEach(function(it){
      var r=row(g,it[1],it[2]); r.setAttribute('data-k',it[0]);
      sw(r,it[1],!!S[it[0]],function(v){S[it[0]]=v?1:0;saveSettings();applySettings();});
    });
    g=group('sgHelp');
    [['fx','setFx','setFxHint'],['eq','setEq','setEqHint'],['auto','setAuto','setAutoHint']].forEach(function(it){
      var r=row(g,it[1],it[2]); r.setAttribute('data-k',it[0]);
      sw(r,it[1],!!S[it[0]],function(v){S[it[0]]=v?1:0;saveSettings();applySettings();});
    });
    g=group('sgSound');
    var r1=row(g,'setSound'); sw(r1,'setSound',!muted,function(v){muted=!v;try{localStorage.setItem('mj_mute',muted?'1':'0');}catch(e){} if(v){ac();SND.select();}});
    var r2=row(g,'setVolume',null,'col'), rg=document.createElement('input');
    rg.type='range'; rg.min=0; rg.max=100; rg.step=5; rg.value=S.vol; rg.id='setVol'; rg.setAttribute('aria-label',tx('setVolume'));
    rg.oninput=function(){S.vol=+rg.value;saveSettings();};
    rg.onchange=function(){ac();SND.match(1);};
    r2.appendChild(rg);
    var r3=row(g,'setVib'); sw(r3,'setVib',!!S.vib,function(v){S.vib=v?1:0;saveSettings();if(v)buzz(30);});
    g=group('sgLang');
    var lg=document.createElement('div'); lg.className='langs';
    [['fr','🇫🇷 FR'],['en','🇬🇧 EN'],['it','🇮🇹 IT']].forEach(function(p){
      var b=document.createElement('button'); b.setAttribute('data-l',p[0]); b.textContent=p[1]; if(p[0]===lang)b.className='on';
      b.onclick=function(){setLang(p[0]);}; lg.appendChild(b);
    });
    g.appendChild(lg);
    var rb=document.createElement('button'); rb.className='reset'; rb.id='bSetReset'; rb.textContent=tx('setReset');
    rb.onclick=function(){
      var k; for(k in SDEF)S[k]=SDEF[k];
      muted=false; try{localStorage.setItem('mj_mute','0');}catch(e){}
      saveSettings(); applySettings(); buildSettings();
    };
    body.appendChild(rb);
  }
  function openSettings(){
    setWasOn=timerOn; stopTimer(); buildSettings();
    document.getElementById('settings').classList.add('show');
  }
  function closeSettings(){
    document.getElementById('settings').classList.remove('show');
    if(setWasOn&&started&&!over&&!menu.classList.contains('show')&&!document.getElementById('guide').classList.contains('show'))startTimer();
    setWasOn=false;
  }
  document.getElementById('bSettings').onclick=openSettings;
  document.getElementById('bSetMenu').onclick=openSettings;
  document.getElementById('bSetOk').onclick=closeSettings;
  // ---------- lingua ----------
  function setTxt(id,key){document.getElementById(id).textContent=tx(key);}
  function applyLang(){
    document.documentElement.lang=lang;
    setTxt('pairsLbl','pairs'); showTime();
    setTxt('lblHint','hint'); setTxt('lblUndo','undo'); setTxt('lblShuf','shuffle'); setTxt('lblNew','restart');
    setTxt('menuSub','chooseLevel'); setTxt('bAgain','again'); setTxt('bMenu','levels');
    document.getElementById('bSettings').setAttribute('aria-label',tx('setAria')); setTxt('bSetMenu','setBtn');
    setTxt('mapTitle','mapTitle'); setTxt('mapSub','mapSub'); setTxt('bMapBack','mapBack'); setTxt('bSetMap','setBtn'); setTxt('bGuideMap','guideBtn');
    if(menu.classList.contains('show'))buildMenu();
    if(map.classList.contains('show'))buildMap();
    if(document.getElementById('settings').classList.contains('show'))buildSettings();
    document.getElementById('close').setAttribute('aria-label',tx('close'));
    document.getElementById('bLevel').setAttribute('aria-label',tx('chooseAria'));
    document.getElementById('bPause').setAttribute('aria-label',tx('pauseAria'));
    document.getElementById('bGuide').setAttribute('aria-label',tx('guideAria'));
    setTxt('bGuideMenu','guideBtn'); setTxt('pauseTitle','pauseTitle'); setTxt('pauseSub','pauseSub'); setTxt('bResume','resumeBtn');
    setTxt('guideTitle','guideTitle'); setTxt('guideSub','guideSub'); setTxt('bGuideOk','ok');
    if(document.getElementById('guide').classList.contains('show'))openGuide();
    document.getElementById('lvNum').textContent=tx('lvShort',{n:localLv(lv)});
    document.getElementById('lvName').textContent=lvTitle(lv);
    if(!rsArm)resetLabel();
    Array.prototype.forEach.call(document.querySelectorAll('button[data-l]'),function(b){b.classList.toggle('on',b.getAttribute('data-l')===lang);});
    if(menu.classList.contains('show'))buildMenu();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#langs button, #langsMap button'),function(b){
    b.addEventListener('click',function(){setLang(b.getAttribute('data-l'));});
  });
  var rz;
  window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(layout,80);});

  // avvio: mostra il menu dei livelli
  applyTheme(LEVELS[0]);
  applyLang();
  applySettings();
  tiles=[]; counts(); pairsEl.textContent='0';
  openMap();
})();
</script>
