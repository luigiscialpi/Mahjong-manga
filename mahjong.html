<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mahjong Manga</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --felt-a:#1f6b57; --felt-b:#134536; --ink:#f6efd9; --ink-soft:#d4e6dc;
  --panel:rgba(0,0,0,.30); --btn:#f3e7c4; --btn-ink:#3b2a14; --btn-shadow:#b49a5e;
  --accent:#e8b43a; --edge:#2a8a62; --edge2:#17503b;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--felt-b);
  background-image:radial-gradient(ellipse at 50% 40%,var(--felt-a),var(--felt-b) 75%);
  color:var(--ink);transition:background .6s;
  font-family:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;gap:8px}
.lv{
  background:var(--panel);color:var(--ink);border:2px solid var(--accent);border-radius:14px;
  min-height:46px;padding:2px 9px;box-shadow:none;align-items:flex-start;flex-direction:column;gap:0;font-size:17px
}
.lv small{font-size:12px;font-weight:600;color:var(--accent)}
.stats{display:flex;gap:6px;align-items:center}
.stat{background:var(--panel);border-radius:12px;padding:4px 7px;text-align:center;min-width:46px}
.stat b{display:block;font-size:17px;color:var(--ink)}
.stat span{font-size:11px;color:var(--ink-soft)}
.mute{background:var(--panel);color:var(--ink);width:44px;min-height:46px;font-size:20px;box-shadow:none;border-radius:14px}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{position:relative}
.tile{
  position:absolute;border-radius:9px;cursor:pointer;
  background:linear-gradient(145deg,#fffdf3 0%,#f6edd2 60%,#eadcb4 100%);
  box-shadow:inset 0 0 0 1.5px rgba(120,95,40,.35),inset 0 2px 3px rgba(255,255,255,.9),
    3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2),5px 8px 10px rgba(0,0,0,.45);
  transition:transform .12s ease,filter .15s ease,opacity .25s ease;
  padding:3px 4px;
}
.tile svg{width:100%;height:100%;display:block;pointer-events:none}
.tile.blocked{filter:brightness(.78) saturate(.8)}
.nodim .tile.blocked{filter:brightness(.88)}
.tile.sel{
  transform:translateY(-4px);filter:none;
  box-shadow:inset 0 0 0 3px var(--accent),inset 0 2px 3px rgba(255,255,255,.9),3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2),0 0 18px 4px var(--accent);
}
.tile.hint{animation:pulse .6s ease-in-out 4}
@keyframes pulse{50%{transform:translateY(-5px) scale(1.06);filter:none;box-shadow:inset 0 0 0 3px #ff6a3d,3px 4px 0 var(--edge),0 0 20px 6px rgba(255,106,61,.9)}}
.tile.gone{opacity:0;transform:scale(.6) rotate(8deg);pointer-events:none}
.tile.hidden{display:none}
.board-in .tile{animation:tin .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes tin{from{opacity:0;transform:translateY(-30px) scale(.7)}to{opacity:1;transform:none}}
.tile.locked{
  background:linear-gradient(145deg,#4f4a82,#2a2552 70%,#1f1b40);
  box-shadow:inset 0 0 0 1.5px rgba(255,207,90,.55),inset 0 2px 3px rgba(255,255,255,.18),
    3px 4px 0 var(--edge),3px 4px 0 1px var(--edge2),5px 8px 10px rgba(0,0,0,.45);
}
.tile.locked.blocked{filter:none}
.tile.unlock{animation:flip .7s cubic-bezier(.2,1.2,.4,1) both,glow 1s ease-out}
@keyframes flip{from{transform:perspective(300px) rotateY(90deg) scale(.8)}to{transform:none}}
@keyframes glow{0%{box-shadow:0 0 0 0 #fff,0 0 30px 10px var(--accent)}100%{}}
.reset{margin:18px auto 8px;min-height:48px;padding:6px 20px;background:transparent;color:var(--ink);border:2px solid var(--ink-soft);box-shadow:none;flex-direction:row;font-size:14px;flex-shrink:0}
.sec{grid-column:1/-1;text-align:center;color:var(--accent);font-weight:700;font-size:15px;margin:8px 0 0}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 12px 12px}
button{
  font:inherit;font-weight:700;font-size:14px;color:var(--btn-ink);background:var(--btn);
  border:0;border-radius:14px;min-height:56px;padding:5px 2px;
  box-shadow:0 4px 0 var(--btn-shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
}
button i{font-style:normal;font-size:19px;line-height:1.1}
button em{font-style:normal;font-size:11px;font-weight:600;opacity:.75}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-shadow)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%) translateY(-20px);
  background:rgba(0,0,0,.78);color:#fff;padding:9px 16px;border-radius:20px;font-size:15px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:5000;text-align:center;max-width:90%;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* overlay */
.ov{position:fixed;inset:0;display:none;z-index:8000}
.ov.show{display:flex}
#menu{
  flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--felt-b);background-image:radial-gradient(ellipse at 50% 20%,var(--felt-a),var(--felt-b) 80%);
}
#menu h2{margin:6px 0 2px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:30px;color:var(--accent);letter-spacing:.5px}
#menu p{margin:0 0 14px;text-align:center;color:var(--ink-soft);font-size:15px}
#close{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));width:46px;min-height:46px;font-size:20px;background:var(--panel);color:var(--ink);box-shadow:none;border-radius:50%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lcard{
  position:relative;min-height:104px;border-radius:18px;color:#fff;text-align:left;align-items:flex-start;justify-content:space-between;
  padding:10px 12px;border:3px solid;box-shadow:0 5px 0 rgba(0,0,0,.35);overflow:hidden;
}
.lcard b{font-size:30px;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.35);font-family:Georgia,serif}
.lcard span{font-size:15px;font-weight:700;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.lcard .stars{font-size:18px;letter-spacing:2px;color:#ffd84a;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.lcard .stars s{text-decoration:none;color:rgba(255,255,255,.35)}
.lcard small{font-size:11px;opacity:.9}
.lcard.locked{filter:grayscale(.85) brightness(.6)}
.lcard.locked::after{content:"🔒";position:absolute;right:10px;top:8px;font-size:22px}
.lcard.cur{outline:3px solid #fff;outline-offset:2px}
#win{z-index:9000;background:rgba(5,15,12,.78);align-items:center;justify-content:center;padding:20px}
#fw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.card{
  position:relative;z-index:1;background:linear-gradient(145deg,#fffdf3,#f1e5c0);color:var(--btn-ink);border-radius:22px;
  padding:22px 20px;text-align:center;max-width:330px;width:100%;
  box-shadow:6px 8px 0 var(--edge2),0 20px 40px rgba(0,0,0,.5);border-top:8px solid var(--accent);
  animation:cardIn .6s cubic-bezier(.2,1.4,.4,1) both;
}
.card .trophy{font-size:54px;line-height:1.1;display:inline-block;animation:trophy 1.2s ease-in-out infinite}
.card h3{margin:2px 0 0;font-family:Georgia,serif;font-size:26px}
.card .sub{margin:2px 0 6px;font-size:15px;color:#7a6a4a}
.card .starrow{font-size:44px;line-height:1.1;margin:4px 0}
.card .st{display:inline-block;color:#d8cfb4;margin:0 2px}
.card .st.on{color:#ffb400;text-shadow:0 2px 0 #b97800;opacity:0;animation:starpop .6s cubic-bezier(.2,1.6,.4,1) forwards}
.card p{margin:4px 0 10px;font-size:16px}
.card button{width:100%;margin-top:8px;font-size:17px;min-height:52px}
.card button.pri{background:var(--edge2);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.card .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@keyframes cardIn{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes trophy{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg) scale(1.1)}}
@keyframes starpop{0%{opacity:0;transform:scale(0) rotate(-90deg)}70%{opacity:1;transform:scale(1.5) rotate(15deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion: reduce){
  .tile,#toast{transition:none}.tile.hint{animation:none;outline:4px solid #ff6a3d}
  .card,.card .trophy,.board-in .tile{animation:none}.card .st.on{animation:none;opacity:1}
}
</style>
</head>
<body>
<header>
  <button class="lv" id="bLevel" aria-label="Scegli livello"><span id="lvNum">Livello 1</span><small id="lvName">Giada</small></button>
  <div class="stats">
    <div class="stat"><b id="pairs">0</b><span>coppie</span></div>
    <div class="stat"><b id="time">0:00</b><span>tempo</span></div>
    <div class="stat" id="lockStat" style="display:none"><b id="locks">0</b><span>🔒</span></div>
    <button class="mute" id="bMute" aria-label="Suono">🔊</button>
  </div>
</header>
<div id="area"><div id="board"></div><div id="toast"></div></div>
<nav>
  <button id="bHint"><i>💡</i>Aiuto<em id="cHint">∞</em></button>
  <button id="bUndo"><i>↩️</i>Annulla<em id="cUndo">∞</em></button>
  <button id="bShuf"><i>🔀</i>Mescola<em id="cShuf">∞</em></button>
  <button id="bNew"><i>🔄</i>Ricomincia<em>&nbsp;</em></button>
</nav>

<div id="menu" class="ov">
  <button id="close" aria-label="Chiudi">✕</button>
  <h2>Mahjong Manga</h2>
  <p>Scegli un livello · 20 sfide</p>
  <div class="grid" id="grid"></div>
  <button class="reset" id="bReset">🗑️ Azzera tutti i progressi</button>
</div>

<div id="win" class="ov"><canvas id="fw"></canvas>
  <div class="card">
    <div class="trophy" id="winIcon">🏆</div>
    <h3 id="winTitle">Livello superato!</h3>
    <div class="sub" id="winSub"></div>
    <div class="starrow" id="winStars"></div>
    <p id="winInfo"></p>
    <button class="pri" id="bNext">Livello successivo ▶</button>
    <div class="row">
      <button id="bAgain">Rigioca</button>
      <button id="bMenu">Livelli</button>
    </div>
  </div>
</div>

<script>

  var O='#3a2a3d';
  function el(tag,a,f,st){return '<'+tag+' '+a+' fill="'+f+'"'+(st===false?'':' stroke="'+O+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"')+'/>';}
  function E(cx,cy,rx,ry,f,st,tr){return el('ellipse','cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"'+(tr?' transform="'+tr+'"':''),f,st);}
  function C(cx,cy,r,f,st){return E(cx,cy,r,r,f,st);}
  function P(d,f,st){return el('path','d="'+d+'"',f,st);}
  function L(d,w){return '<path d="'+d+'" fill="none" stroke="'+O+'" stroke-width="'+(w||1.4)+'" stroke-linecap="round" stroke-linejoin="round"/>';}
  function eye(x,y,c,k){
    k=k||1;
    return E(x,y,4.4*k,5.7*k,O,false)+E(x,y+.8*k,3.5*k,4.6*k,c,false)+
           E(x,y-2.2*k,3.5*k,2*k,'rgba(0,0,0,.25)',false)+
           C(x-1.4*k,y-2*k,1.9*k,'#fff',false)+C(x+1.5*k,y+2.4*k,k,'#fff',false);
  }
  function blush(x,y,c){return E(x,y,4.2,2.3,c||'#ff6f94',false).replace('/>',' opacity=".55"/>');}
  function omega(x,y){return L('M'+(x-3.5)+' '+y+' q1.75 2.8 3.5 0 q1.75 2.8 3.5 0',1.3);}
  function smileV(x,y,w){return L('M'+x+' '+y+' q'+(-w/2)+' 3 '+(-w)+' .5 M'+x+' '+y+' q'+(w/2)+' 3 '+w+' .5',1.3);}

  var NUMFONT = "'Arial Rounded MT Bold','Trebuchet MS','Segoe UI',Roboto,sans-serif";
  function glyph(t,col){
    var a='text-anchor="middle" font-size="54" font-weight="900" font-family="'+NUMFONT+'"';
    return '<text x="32" y="59.5" '+a+' fill="'+O+'" stroke="'+O+'" stroke-width="3.4" stroke-linejoin="round">'+t+'</text>'+

    L('M5 47 l9 2 M5 54 l9 -1 M55 47 l-9 2 M55 54 l-9 -1',1)+blush(14,53)+blush(46,53),
    // cane
    E(9.5,40,7,14,'#a8683a',true,'rotate(14 9.5 40)')+E(50.5,40,7,14,'#a8683a',true,'rotate(-14 50.5 40)')+

  function assign(list,ntypes,unl0,GG){
    unl0=unl0||0; GG=GG||0;
    var n=list.length/2, need=Math.max(0,GG-unl0), attempt, i;
    var allT=TYPES.map(function(_,k){return k;});
    for(attempt=0;attempt<1500;attempt++){
      var starG=[], pairsLeft=n, c=need, sz;
      while(c>0&&pairsLeft>0){
        sz=(pairsLeft>=2)?4:2;
        starG.push({size:sz,star:true,type:STAR_IDX});
        pairsLeft-=sz/2; c-=sz/2;
      }
      var pool=allT.filter(function(k){return need?k!==STAR_IDX:true;});
      var K2=Math.max(1,Math.min(need?ntypes-1:ntypes,pairsLeft));
      var order=shuffleArr(pool).slice(0,K2);
      var rest=makeGroups(pairsLeft,K2); shuffleArr(rest);
      var seq=rest.map(function(z,k){return {size:z,star:false,type:order[k%order.length]};});
      starG.slice(1).forEach(function(sg){
        var pos=Math.floor(Math.random()*Math.ceil((seq.length+1)*.4));
        seq.splice(pos,0,sg);
      });
      if(starG.length)seq.unshift(starG[0]);
      var al=list.slice(), ok=true, res=[], u=unl0;
      for(i=0;i<seq.length;i++){
        var g=seq[i];
        var free=al.filter(function(t){return (t.hid||0)<=u&&isFree(t,al);});
        if(free.length<g.size){ok=false;break;}
        free.forEach(function(t){t._k=t.z+Math.random()*1.6;});
        free.sort(function(a,b){return b._k-a._k;});
        var pick=free.slice(0,g.size);
        res.push([pick,g.type]);
        pick.forEach(function(t){al.splice(al.indexOf(t),1);});
        if(g.star&&u<GG)u=Math.min(GG,u+g.size/2);
      }
      if(ok){res.forEach(function(r){r[0].forEach(function(t){t.type=r[1];});});return true;}
    }
    var o2=shuffleArr(allT).slice(0,ntypes);
    list.forEach(function(t,k){t.type=o2[Math.floor(k/2)%o2.length];});
    return false;
  }

  var board=document.getElementById('board'), area=document.getElementById('area');
  var toastEl=document.getElementById('toast');
  var pairsEl=document.getElementById('pairs'), timeEl=document.getElementById('time');
  var lockStat=document.getElementById('lockStat'), locksEl=document.getElementById('locks');
  var tiles=[], tw=50, th=65, COLS=4, ROWS=4, LAYER_DX=-4, LAYER_DY=-5, maxZ=0;
  var sel=null, history=[], secs=0, timer=null, over=false, started=false, unl=0;
  var hintsLeft=0, shufLeft=0, undoLeft=0, combo=0, lastMatch=0;

  function G(){return cfg.hid?cfg.hid.length:0;}
  function isLocked(t){return (t.hid||0)>unl;}
  function selectable(t,al){return !isLocked(t)&&isFree(t,al);}
  function alive(){return tiles.filter(function(t){return !t.gone;});}
  function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
  function toast(msg,ms){
    toastEl.textContent=msg; toastEl.classList.add('show');
    clearTimeout(toast.t); toast.t=setTimeout(function(){toastEl.classList.remove('show');},ms||2300);
  }
  function applyTheme(c){
    var s=document.documentElement.style, k=['--felt-a','--felt-b','--accent','--edge','--edge2'];
    k.forEach(function(n,i){s.setProperty(n,c.th[i]);});
  }
  function counts(){
    document.getElementById('cHint').textContent=hintsLeft===null?'∞':hintsLeft;
    document.getElementById('cUndo').textContent=undoLeft===null?'∞':undoLeft;
    document.getElementById('cShuf').textContent=shufLeft===null?'∞':shufLeft;
  }
  var LOCKED='<circle cx="30" cy="40" r="27" fill="rgba(255,255,255,.07)" stroke="#ffcf5a" stroke-width="1.6" stroke-dasharray="3 3"/>'+
    '<path d="'+starPath(30,19,8.5,3.8)+'" fill="none" stroke="#ffcf5a" stroke-width="1.6" stroke-linejoin="round"/>'+
    '<text x="30" y="55" text-anchor="middle" font-size="34" font-weight="900" fill="#ffcf5a" font-family="Georgia,serif">?</text>'+
    '<rect x="24" y="60" width="12" height="9" rx="2" fill="#ffcf5a"/>'+
    '<path d="M26.5 60 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#ffcf5a" stroke-width="1.8"/>';
  function paintTile(t){
    var lk=isLocked(t);
    t.el.classList.toggle('locked',lk);
    t.el.innerHTML='<svg viewBox="0 0 60 80" preserveAspectRatio="xMidYMid meet">'+(lk?LOCKED:TYPES[t.type])+'</svg>';
  }
  function layout(){
    var maxX=0,maxY=0; maxZ=0;
    tiles.forEach(function(t){maxX=Math.max(maxX,t.x+1);maxY=Math.max(maxY,t.y+1);maxZ=Math.max(maxZ,t.z);});
    COLS=maxX; ROWS=maxY;
    var ex=maxZ*-LAYER_DX+8, ey=maxZ*-LAYER_DY+8;
    var aw=area.clientWidth-14-ex, ah=area.clientHeight-10-ey;
    tw=Math.floor(Math.min(aw/COLS,ah/ROWS/1.3,64));
    th=Math.floor(tw*1.3);
    board.style.width=(COLS*tw+ex)+'px'; board.style.height=(ROWS*th+ey)+'px';
    tiles.forEach(function(t){
      var s=t.el.style;
      s.width=(tw-3)+'px'; s.height=(th-3)+'px';
      s.left=(t.x*tw+t.z*LAYER_DX+maxZ*-LAYER_DX+4)+'px'; s.top=(t.y*th+t.z*LAYER_DY+maxZ*-LAYER_DY+4)+'px';
      s.zIndex=t.z*1000+Math.round(t.y*10)+Math.round(t.x);
      s.animationDelay=(t.z*.12+t.y*.03+t.x*.02)+'s';
    });
  }
  function refresh(){
    var al=alive(), left=0;
    tiles.forEach(function(t){
      if(t.gone)return;
      var lk=isLocked(t); if(lk)left++;
      t.el.classList.toggle('blocked',!lk&&!isFree(t,al));
      t.el.classList.toggle('sel',t===sel);
      t.el.classList.remove('hint');
    });
    pairsEl.textContent=al.length/2;
    lockStat.style.display=G()?'':'none'; locksEl.textContent=left;
  }
  function findMove(){
    var al=alive(), free=al.filter(function(t){return selectable(t,al);}), i, j, all=[];
    for(i=0;i<free.length;i++)for(j=i+1;j<free.length;j++)
      if(free[i].type===free[j].type)all.push([free[i],free[j]]);
    if(!all.length)return null;
    if(unl<G()){
      for(i=0;i<all.length;i++)if(all[i][0].type===STAR_IDX)return all[i];
    }
    return all[0];
  }
  function startTimer(){clearInterval(timer);timer=setInterval(function(){secs++;timeEl.textContent=fmt(secs);},1000);}

  function tap(t){
    if(over||t.gone)return;
    var al=alive();
    if(isLocked(t)){SND.blocked();toast('🔒 Abbina due ⭐ per sbloccarla!');return;}
    if(!isFree(t,al)){SND.blocked();toast('Questa tessera è bloccata');return;}
    if(sel===t){sel=null;refresh();return;}
    if(!sel){sel=t;SND.select();refresh();return;}
    if(sel.type===t.type){
      var a=sel,b=t; sel=null;
      var now=Date.now(); combo=(now-lastMatch<4500)?combo+1:0; lastMatch=now;
      var g=0;
      if(a.type===STAR_IDX&&unl<G()){unl++;g=unl;}
      history.push([a,b,g]);
      if(!g)SND.match(combo);
      buzz(14);
      a.gone=b.gone=true;
      a.el.classList.add('gone'); b.el.classList.add('gone');
      setTimeout(function(){if(a.gone)a.el.classList.add('hidden');if(b.gone)b.el.classList.add('hidden');},260);
      if(g)unlockGroup(g);
      refresh(); afterMove();
    } else {sel=t;SND.select();refresh();}
  }
  function unlockGroup(g){
    SND.match(4); SND.unlock();
    tiles.forEach(function(t){
      if(t.hid===g&&!t.gone){
        paintTile(t); t.el.classList.remove('unlock'); void t.el.offsetWidth; t.el.classList.add('unlock');
      }
    });
    setTimeout(function(){tiles.forEach(function(t){t.el.classList.remove('unlock');});},1000);
    toast('🔓 Tessere sbloccate!',2600);
  }
  function rescue(){
    if(over)return;
    var al=alive(); if(al.length<2)return;
    SND.stuck(); toast('Nessuna mossa: rimescolo le tessere per te! 🔀',2400);
    clearTimeout(rescue.t);
    rescue.t=setTimeout(function(){
      if(over||findMove())return;
      var a2=alive(); assign(a2,cfg.n,unl,G()); sel=null; a2.forEach(paintTile); refresh(); SND.shuffle();
    },1100);
  }
  function afterMove(){
    var al=alive();
    if(al.length===0){setTimeout(win,350);return;}
    if(!findMove())rescue();
  }

  // ================= EFFETTI VITTORIA =================
  var fwC=document.getElementById('fw'), fx=fwC.getContext('2d');
  var fwRun=false, rockets=[], sparks=[], confetti=[], fwLast=0, fwNext=0, fwW=0, fwH=0, confUntil=0, lastBoom=0, fwLevel=1;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fwSize(){
    var d=window.devicePixelRatio||1;
    fwW=window.innerWidth; fwH=window.innerHeight;
    fwC.width=fwW*d; fwC.height=fwH*d; fx.setTransform(d,0,0,d,0,0);
  }
  function launch(){
    rockets.push({x:fwW*(.12+Math.random()*.76),y:fwH,vx:(Math.random()-.5)*50,
      vy:-(fwH*(.85+Math.random()*.35)),ty:fwH*(.1+Math.random()*.35)});
  }
  function explode(r){
    var hue=Math.random()*360, n=(reduce?26:50+fwLevel*9), i, a, sp, two=Math.random()<.5;
    var now=Date.now(); if(now-lastBoom>140){SND.boom();lastBoom=now;}
    for(i=0;i<n;i++){
      a=Math.random()*Math.PI*2; sp=60+Math.random()*(fwW<500?170:260);
      if(Math.random()<.35)sp*=.45;
      sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.55+Math.random()*.5,
        c:'hsl('+((two&&i%2?hue+150:hue)+Math.random()*30)+',100%,'+(60+Math.random()*20)+'%)'});
    }
  }
  var CONF=['#ff5c8a','#ffc21a','#4a90e8','#2ec4a0','#9b5de5','#ffffff','#ff8a3d'];
  function spawnConf(k){
    for(var i=0;i<k;i++)confetti.push({x:Math.random()*fwW,y:-12,vx:(Math.random()-.5)*60,vy:90+Math.random()*180,
      r:Math.random()*6.28,vr:(Math.random()-.5)*10,w:6+Math.random()*6,h:4+Math.random()*5,
      c:CONF[Math.floor(Math.random()*CONF.length)],ph:Math.random()*6.28});
  }
  function fwLoop(t){
    if(!fwRun)return;
    var dt=Math.min((t-fwLast)/1000,.05); fwLast=t;
    fx.clearRect(0,0,fwW,fwH);
    var i,r,p;
    fwNext-=dt; if(fwNext<=0){launch();fwNext=Math.max(.16,.6-fwLevel*.045)+Math.random()*.3;}
    if(!reduce&&t<confUntil)spawnConf(2);
    for(i=confetti.length-1;i>=0;i--){
      p=confetti[i]; p.ph+=dt*4; p.x+=(p.vx+Math.sin(p.ph)*40)*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
      if(p.y>fwH+20){confetti.splice(i,1);continue;}
      fx.save(); fx.translate(p.x,p.y); fx.rotate(p.r); fx.scale(1,Math.cos(p.ph*1.3));
      fx.fillStyle=p.c; fx.fillRect(-p.w/2,-p.h/2,p.w,p.h); fx.restore();
    }
    for(i=rockets.length-1;i>=0;i--){
      r=rockets[i]; var px=r.x,py=r.y;
      r.x+=r.vx*dt; r.y+=r.vy*dt; r.vy+=120*dt;
      fx.strokeStyle='#fff6c8'; fx.lineWidth=2.5; fx.lineCap='round';
      fx.beginPath(); fx.moveTo(px,py); fx.lineTo(r.x,r.y); fx.stroke();
      if(r.y<=r.ty||r.vy>-40){explode(r);rockets.splice(i,1);}
    }
    for(i=sparks.length-1;i>=0;i--){
      p=sparks[i]; var ox=p.x,oy=p.y;
      p.vx*=.985; p.vy=p.vy*.985+150*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=p.decay*dt;
      if(p.life<=0){sparks.splice(i,1);continue;}
      fx.globalAlpha=Math.max(p.life,0); fx.strokeStyle=p.c; fx.lineWidth=2.6*p.life+.6; fx.lineCap='round';
      fx.beginPath(); fx.moveTo(ox,oy); fx.lineTo(p.x,p.y); fx.stroke();
    }
    fx.globalAlpha=1;
    requestAnimationFrame(fwLoop);
  }
  function startFx(level,grand){
    fwSize(); rockets=[]; sparks=[]; confetti=[]; fwNext=0; fwRun=true; fwLevel=Math.min(level,12);
    var n=2+Math.floor(fwLevel/3)+(grand?3:0); for(var i=0;i<n;i++)launch();
    fwLast=performance.now(); confUntil=fwLast+(grand?9000:5000);
    if(!reduce)spawnConf(60+level*8);
    requestAnimationFrame(fwLoop);
  }
  function stopFx(){fwRun=false;fx.clearRect(0,0,fwW,fwH);}
  window.addEventListener('resize',function(){if(fwRun)fwSize();});

  function win(){
    over=true; clearInterval(timer);
    var pairsTotal=tiles.length/2;
    var stars=secs<=pairsTotal*5?3:(secs<=pairsTotal*10?2:1);
    var oldBest=prog.best[lv];
    if((prog.stars[lv]||0)<stars)prog.stars[lv]=stars;
    var rec=false;
    if(!oldBest||secs<oldBest){prog.best[lv]=secs;rec=!!oldBest;}
    var grand=(lv===LEVELS.length);
    if(!grand&&prog.unlocked<lv+1)prog.unlocked=lv+1;
    saveProg();
    document.getElementById('winIcon').textContent=grand?'👑':'🏆';
    document.getElementById('winTitle').textContent=grand?'Campione assoluto!':'Livello '+lv+' superato!';
    document.getElementById('winSub').textContent=grand?'Hai completato tutti i '+LEVELS.length+' livelli':cfg.name;
    var h='',i; for(i=0;i<3;i++)h+='<span class="st'+(i<stars?' on':'')+'" style="animation-delay:'+(.5+i*.4)+'s">★</span>';
    document.getElementById('winStars').innerHTML=h;
    for(i=0;i<stars;i++)(function(k){setTimeout(function(){SND.star(k);},500+k*400);})(i);
    document.getElementById('winInfo').textContent='Tempo: '+fmt(secs)+(rec?'  ·  Nuovo record!':(oldBest?'  ·  Record: '+fmt(Math.min(oldBest,secs)):''));
    document.getElementById('bNext').style.display=grand?'none':'';
    document.getElementById('bNext').textContent='Livello '+(lv+1)+' ▶';
    document.getElementById('win').classList.remove('show'); void document.getElementById('win').offsetWidth;
    document.getElementById('win').classList.add('show');
    SND.win(); startFx(lv,grand);
    if(grand)setTimeout(function(){SND.win();},1600);
  }

  // ================= AVVIO LIVELLO =================
  function startLevel(n){
    lv=n; cfg=LEVELS[n-1];
    stopFx(); closeMenu(true);
    document.getElementById('win').classList.remove('show');
    applyTheme(cfg);
    document.getElementById('lvNum').textContent='Livello '+n;
    document.getElementById('lvName').textContent=cfg.name;
    var list=[]; cfg.build(list);
    tiles=list; tiles.forEach(function(t){t.gone=false;t.hid=0;});
    if(cfg.hid)markHidden(tiles,cfg.hid);
    unl=0;
    assign(tiles,cfg.n,0,G());
    over=false; started=true; sel=null; history=[]; secs=0; combo=0; lastMatch=0;
    hintsLeft=cfg.hints; shufLeft=cfg.shuf; undoLeft=cfg.undo; counts();
    timeEl.textContent='0:00';
    board.innerHTML=''; board.classList.toggle('nodim',!cfg.dim);
    board.classList.remove('board-in');
    tiles.forEach(function(t){
      var d=document.createElement('div'); d.className='tile'; t.el=d;
      d.addEventListener('click',function(){tap(t);});
      paintTile(t); board.appendChild(d);
    });
    layout(); refresh();
    void board.offsetWidth; board.classList.add('board-in');
    SND.start(); startTimer();
    if(cfg.hid)toast('🔒 Ci sono tessere nascoste: abbina due ⭐ per sbloccarle!',4200);
    setTimeout(function(){board.classList.remove('board-in');},1800);
  }

  // ================= MENU =================
  var menu=document.getElementById('menu');
  function buildMenu(){
    var g=document.getElementById('grid'); g.innerHTML='';
    LEVELS.forEach(function(L,i){
      var n=i+1;
      if(n===1||n===11){
        var h=document.createElement('div'); h.className='sec';
        h.textContent=n===1?'Livelli classici':'Tessere nascoste 🔒 · abbina due ⭐ per sbloccarle';
        g.appendChild(h);
      }
      var b=document.createElement('button'), st=prog.stars[n]||0, locked=n>prog.unlocked;
      b.className='lcard'+(locked?' locked':'')+(started&&n===lv?' cur':'');
      b.style.background='linear-gradient(145deg,'+L.th[0]+','+L.th[1]+')';
      b.style.borderColor=L.th[2];
      var s=''; for(var k=0;k<3;k++)s+=(k<st?'★':'<s>★</s>');
      b.innerHTML='<b>'+n+'</b><span>'+L.name+'</span><div class="stars">'+s+'</div>'+
        '<small>'+(prog.best[n]?'Record '+fmt(prog.best[n]):(locked?'Bloccato':fmtInfo(L)))+'</small>';
      b.addEventListener('click',function(){
        if(locked){SND.blocked();return;} ac(); startLevel(n);
      });
      g.appendChild(b);
    });
  }
  function fmtInfo(L){
    var t=[];L.build(t);
    return t.length/2+' coppie'+(L.hid?' · 🔒'+L.hid.reduce(function(a,b){return a+b;},0):'');
  }
  function openMenu(){
    clearInterval(timer); buildMenu();
    document.getElementById('close').style.display=started&&!over?'':'none';
    menu.classList.add('show');
  }
  function closeMenu(silent){
    menu.classList.remove('show');
    if(!silent&&started&&!over)startTimer();
  }

  // ================= PULSANTI =================
  document.addEventListener('pointerdown',function(){ac();},{once:true});
  document.getElementById('bLevel').onclick=function(){stopFx();document.getElementById('win').classList.remove('show');openMenu();};
  document.getElementById('close').onclick=function(){closeMenu();};
  document.getElementById('bMenu').onclick=function(){stopFx();document.getElementById('win').classList.remove('show');openMenu();};
  document.getElementById('bAgain').onclick=function(){startLevel(lv);};
  document.getElementById('bNext').onclick=function(){startLevel(Math.min(lv+1,LEVELS.length));};
  document.getElementById('bNew').onclick=function(){startLevel(lv);};
  var muteB=document.getElementById('bMute');
  function muteUI(){muteB.textContent=muted?'🔇':'🔊';}
  muteB.onclick=function(){
    muted=!muted; muteUI();
    try{localStorage.setItem('mj_mute',muted?'1':'0');}catch(e){}
    if(!muted){ac();SND.select();}
  };
  muteUI();
  document.getElementById('bHint').onclick=function(){
    if(over)return;
    if(hintsLeft!==null&&hintsLeft<=0){toast('Aiuti finiti!');SND.blocked();return;}
    var m=findMove();
    if(!m){rescue();return;}
    if(hintsLeft!==null)hintsLeft--; counts(); SND.hint();
    m[0].el.classList.remove('hint'); m[1].el.classList.remove('hint'); void m[0].el.offsetWidth;
    m[0].el.classList.add('hint'); m[1].el.classList.add('hint');
  };
  document.getElementById('bUndo').onclick=function(){
    if(over)return;
    if(!history.length){toast('Niente da annullare');return;}
    if(undoLeft!==null&&undoLeft<=0){toast('Annulla finiti!');SND.blocked();return;}
    if(undoLeft!==null)undoLeft--; counts(); SND.undo();
    var p=history.pop();
    if(p[2]){unl=p[2]-1; tiles.forEach(function(t){if(t.hid===p[2])paintTile(t);});}
    p[0].gone=false;p[1].gone=false;
    [p[0],p[1]].forEach(function(t){t.el.classList.remove('gone','hidden');});
    sel=null; refresh();
  };
  document.getElementById('bShuf').onclick=function(){
    if(over)return;
    if(shufLeft!==null&&shufLeft<=0){toast('Mescolate finite!');SND.blocked();return;}
    var al=alive(); if(al.length<2)return;
    if(shufLeft!==null)shufLeft--; counts();
    assign(al,cfg.n,unl,G()); sel=null; al.forEach(paintTile); refresh();
    SND.shuffle(); toast('Tessere mescolate!');
  };
  var rsArm=false, rsT;
  var resetB=document.getElementById('bReset');
  function resetLabel(){rsArm=false;resetB.textContent='🗑️ Azzera tutti i progressi';}
  resetB.onclick=function(){
    if(!rsArm){
      rsArm=true; resetB.textContent='⚠️ Tocca di nuovo per confermare';
      clearTimeout(rsT); rsT=setTimeout(resetLabel,3500); return;
    }
    clearTimeout(rsT);
    prog={unlocked:1,stars:{},best:{}}; saveProg();
    try{localStorage.removeItem('mj_prog2');}catch(e){}
    SND.start(); buildMenu();
    rsArm=false; resetB.textContent='✅ Progressi azzerati';
    rsT=setTimeout(resetLabel,2200);
  };
  var rz;
  window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(layout,80);});

  // avvio: mostra il menu dei livelli
  applyTheme(LEVELS[0]);
  tiles=[]; counts(); pairsEl.textContent='0';
  openMenu();
})();
</script>
